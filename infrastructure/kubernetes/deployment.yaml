apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-platform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slack-platform-api
  template:
    metadata:
      labels:
        app: slack-platform-api
    spec:
      containers:
        - name: api
          image: slack-platform/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:postgres@postgres:5432/slack_platform
            - name: REDIS_URL
              value: redis://:redis_password@redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: slack-platform-api
spec:
  selector:
    app: slack-platform-api
  ports:
    - port: 80
      targetPort: 8000
